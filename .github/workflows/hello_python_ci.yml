name: Hello Python CI

on: 
    push: #  MEANS  the pipeline will run when there is a push to the repository
      branches: 
        - main
    workflow_dispatch: #  MEANS  you can  run the pipeline manually

jobs: 
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Script
        run: python my_script.py

      - name: Install Dependencies
        working-directory: docker/app1-hello/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Tests
        working-directory: docker/app1-hello/python
        run: python -m py_compile main.py

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps: 
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Repository name with owner. For example, actions/checkout
          # Default: ${{ github.repository }}
          repository: ''
       


  

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hello-python:latest



