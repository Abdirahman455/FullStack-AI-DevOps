
name: Hello Python AWS EKS CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker/app1-hello/python/hello-python/**'

jobs:

  # ============================================================
  # JOB 1: BUILD AND TEST
  # ============================================================
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build and Test Python
        working-directory: docker/app1-hello/python/hello-python
        run: |
          python -m unittest discover -s tests

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/python/hello-python


  # ============================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Run Python Tests
        working-directory: docker/app1-hello/python/hello-python
        run: |
          python -m unittest discover -s tests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/python/hello-python
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-python:${{ github.ref_name }}


  # ============================================================
  # JOB 3: DEPLOY TO AWS EKS
  # ============================================================
  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS cluster
        run: |
          aws eks update-kubeconfig \
            --name hello-cluster \
            --region us-east-2

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      - name: Verify EKS Connection
        run: |
          kubectl get nodes

      - name: Deploy to AWS EKS
        run: |
          kubectl apply -f k8s/aws/app1-hello/app.yaml

      - name: Verify Deployment
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

