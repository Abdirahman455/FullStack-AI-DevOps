name: Hello Spring Boot App to Docker 

on: 
  push
  

jobs: 
  build-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Build and Test (Maven)
        working-directory: docker/app1-hello/hello-spring-boot
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/hello-spring-boot/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps: 
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Build JAR for Docker
        working-directory: docker/app1-hello/hello-spring-boot
        run: echo ''

      - name: Login to Docker Hub
        run: echo ''
      - name: Build and Push Docker Image
        run: echo ''