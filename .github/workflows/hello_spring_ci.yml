name: Hello Spring Boot App to Docker 

on: 
  push
  

jobs: 
  build-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Build and Test (Maven)
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean verify

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/springboot/hello-spring/target/surefire-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps: 
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Build JAR for Docker
        working-directory: docker/app1-hello/springboot/hello-spring
        run: mvn -B clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/springboot/hello-spring  
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-spring:${{ github.ref_name }}
