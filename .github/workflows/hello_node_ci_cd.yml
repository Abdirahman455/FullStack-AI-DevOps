name: Hello Node App AWS EKS CI/CD

on:

  workflow_dispatch:
  push:
   # branches:
   #   - main

   paths:
      - 'docker/app1-hello/node/hello-node/**'
    

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Build and Test (Node.js)
        working-directory: docker/app1-hello/node/hello-node
        run: npm run build

      - name: Upload Test Reports
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: docker/app1-hello/node/hello-node/test-reports

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Build and Test (Node.js)
        working-directory: docker/app1-hello/node/hello-node
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Dockerhub
        uses: docker/build-push-action@v7
        with:
          context: docker/app1-hello/node/hello-node
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-node:${{ github.ref_name }}

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig for EKS cluster
        run:  aws eks update-kubeconfig --name hello-cluster --region eu-central-1

      - name: Verify Connection to EKS Cluster
        run: kubectl get nodes

      - name: Deploy to AWS (Kubernetes)
        run: kubectl apply -f k8s/aws/app1-hello/app.yaml
