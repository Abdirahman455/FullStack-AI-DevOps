name: Demo CI Env Secrets Input

on:
  push:
    branches:
      - main
 # workflow_dispatch:

env:
  GLOBAL_APP_ENV: global-dev

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JOB_APP_ENV: Job-dev

    steps:
      - name: Say Hello
        run: echo "Hello from the second workflow!"

      - name: Install
        env:
          APP_ENV: dev
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: echo "Environment $APP_ENV using $DB_PASSWORD, ${GLOBAL_APP_ENV}, ${JOB_APP_ENV}"